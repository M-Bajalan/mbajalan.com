<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — mbajalan.com</title>
<!-- Deliberately self-contained: a 404 has to render even if the site
     stylesheet is the thing that failed. Colours are inlined rather than
     tokenised for that reason, but they still follow the reader's theme so
     this page does not flash white at someone browsing in the dark. -->
<style>
  :root { color-scheme: light dark; }

  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf4ed;
    background: light-dark(#faf4ed, #130e0b);
    color: #1e1712;
    color: light-dark(#1e1712, #e5e0da);
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
  }
  main {
    padding: 2rem;
  }
  p {
    font-size: 1.1rem;
    margin: 0 0 1.5rem;
  }
  a {
    color: #75190a;
    color: light-dark(#75190a, #f19266);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <p>Page not found.</p>
  <a href="/">mbajalan.com</a>
</main>
</body>
</html>
